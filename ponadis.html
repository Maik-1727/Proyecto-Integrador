    <!--No afecta el orden en que los pongamos-->

    <!-- Bootstrap-->

      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

  <body>
    <!-- <i class="fa-solid fa-bell presonalizacion-icono" aria-hidden="true"></i> -->

    <!-- Ejercicio: Personalizar el ícono para que tenga un borde: 1px solid #cccccc; border-radius: 3px y el tamño de 24px -->

    <!-- TOPBAR (Barra Superior) -->
    <div class="container-fluid topbar">
      <!-- Fila 1-->
      <div class="row d-flex align-items-center h-100">
        <!-- Fila 1-->
        <div class="col-3 text-start">
          <!-- Columna 1-->
          <a href="#" class="text-decoration-none logo">
            <span>SICID <small>Intranet</small></span>
            <!--Es igual que un div (contenedor de una sola linea) -->
          </a>
        </div>

        <div class="col-6 d-flex align-items-center">
          <!-- Columna 2-->
          <p class="mb-0">
            <strong>PONADIS</strong> -<span class="visually-hidden">Rol:</span> Administrador
          </p>
          <!-- Tarea Moral 1: Dar el efecto visual del diseño al <p> del rol -->
          <!-- Tarea Moral 2: Investigar propiedades de bootstrap -->
        </div>

        <div class="col-3 text-end">
          <!-- Columna 3: Otras opciones-->
          <div class="row d-flex align-items-center justify-content-around">
            <div class="col-3 d-flex align-items-center justify-content-end">
              <!-- Opciones: - A + -->
              <button class="btn" aria-label="Disminuir el tamaño de la fuente">
                <i class="fa-solid fa-minus border rounded-1 p-2" aria-hidden="true"></i>
              </button>

              <!-- Tarea Moral 4: Hacer accessibles los otros dos botones-->
              <button class="btn" aria-label="Cambiar tipo de la fuente">
                <i class="fa-solid fa-a border rounded-1 p-2" aria-hidden="true"></i>
              </button>

              <button
                class="btn"
                aria-label="Incrementar el tamaño de la fuente"
              >
                <i class="fa-solid fa-plus border rounded-1 p-2" aria-hidden="true"></i>
              </button>
            </div>

            <div class="col-1">
              <!-- Paleta de Colores -->
              <!--Ejercicio Completar-->
              <button class="btn" aria-label="Cambiar la paleta de colores">
                <i class="fa-solid fa-circle-half-stroke border rounded-1 p-2" aria-hidden="true"></i>
              </button>
            </div>

            <div class="col-1">
              <!--Notificaciones-->
              <!--Ejercicio Completar-->
              <button class="btn" aria-label="Ver Notificaciones">
                <i class="fa-solid fa-bell" aria-hidden="true"></i>
              </button>
            </div>

            <!-- Ejercicio: Cambiar  por la columna por la opciones Registrar Usuario / Iniciar sesion -->
            <div class="col-2">
              <!--Usuario-->
              <a href="" class="text-decoration-none mb-0 btn">Iniciar Sesión</a>
            </div>

            <div class="col-2">
              <a href="crear-cuenta.html" target="_blank" class="text-decoration-none mb-0 p-1 btn btn-outline-secondary">Crear Cuentas</a>
            </div>

            <!-- Ejercicio: Crear formulario para registrar usuario y uno formulario para iniciar sesion (Componentes de Bootstrap)-->
          </div>
        </div>
      </div>
    </div>
